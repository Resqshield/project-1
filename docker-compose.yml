# =============================================================================
# ResQShield / ResQNet — Local Development Database Service
# Pinned image containing PostgreSQL 16 + PostGIS + TimescaleDB
# =============================================================================

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16.3-ts2.15.3-all
    container_name: resqshield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: resqshield
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - resqshield_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d resqshield"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  resqshield_pgdata:
