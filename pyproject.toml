[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resqshield-ml"
version = "1.0.0"
description = "ResQShield AI — Flood & Landslide Early Warning ML Pipeline"
authors = [{ name = "ResQShield Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7.0"]
hpo = ["hyperopt>=0.2.7"]
viz = ["matplotlib>=3.7.0", "seaborn>=0.12.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.0.0"]
all = ["xgboost>=1.7.0", "hyperopt>=0.2.7", "matplotlib>=3.7.0", "seaborn>=0.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
