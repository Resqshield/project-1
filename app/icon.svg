<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- dark rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- vegvísir-inspired wayfinder: 8 rune rays -->
  <g stroke="url(#ray)" stroke-width="2.6" stroke-linecap="round" fill="none">
    <!-- N (storm-guard: forked tip) -->
    <path d="M32 32 V12 M27 16 L32 12 L37 16"/>
    <!-- S (crossbars) -->
    <path d="M32 32 V52 M27 48 H37 M28.5 43 H35.5"/>
    <!-- E -->
    <path d="M32 32 H52 M48 27 V37"/>
    <!-- W -->
    <path d="M32 32 H12 M16 27 V37 M20 29 V35"/>
    <!-- diagonals -->
    <path d="M32 32 L46 18 M42 17 L47 17 L47 22"/>
    <path d="M32 32 L18 18 M17 22 L17 17 L22 17"/>
    <path d="M32 32 L46 46 M47 42 L47 47 L42 47"/>
    <path d="M32 32 L18 46 M22 47 L17 47 L17 42"/>
  </g>

  <!-- pulse core -->
  <circle cx="32" cy="32" r="4.4" fill="#0a0e1a" stroke="#7dd3fc" stroke-width="2"/>
  <circle cx="32" cy="32" r="1.7" fill="#7dd3fc"/>
</svg>
