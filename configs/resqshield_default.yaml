# ResQShield Experiment Configuration — Default
# -----------------------------------------------
# This YAML drives the entire training pipeline.
# Edit this file to change model, features, or thresholds.
# Do NOT hard-code paths in source files — always read from here.

# ─── Experiment Identity ───────────────────────────────────────────────────────
experiment:
  name: "resqshield_baseline_v1"
  description: "Baseline XGBoost flood-level regressor on sensor data"
  seed: 42
  version: "1.0.0"

# ─── Data Paths ────────────────────────────────────────────────────────────────
data:
  raw_sensor_csv: "data/raw/sensor_data.csv"
  processed_features_csv: "data/processed/features.csv"
  # Column names in the raw CSV
  timestamp_col: "timestamp"
  target_col: "water_level_m"           # The column to predict
  station_id_col: "station_id"          # Optional: for multi-station data

# ─── Train / Validation / Test Split ───────────────────────────────────────────
# Chronological split — NEVER shuffle time-series data
split:
  train_end: "2023-12-31"               # All data up to this date = training
  val_end: "2024-06-30"                 # Up to this date = validation
  # Anything after val_end = test set
  # Leave null to use all data for training (no held-out test)

# ─── Feature Engineering ───────────────────────────────────────────────────────
# Algorithmic approach adapted from:
#   ECMWFCode4Earth/ml_flood :: utils_floodmodel.py :: shift_and_aggregate()
#   (MIT License — @lkugler, @seblehner, ESoWC 2019)
features:
  # Lag windows for each sensor column (in hours, assuming hourly data)
  lag_hours: [1, 2, 3, 6, 12, 24, 48, 72]

  # Rolling cumulative sum windows (hours)
  rolling_sum_windows: [3, 6, 12, 24, 48, 72]

  # Rate of change (delta) features — critical for early warning
  delta_features:
    - col: "water_level_m"
      windows: [1, 3, 6]               # Δwater_level over N hours

  # Columns to apply lag + rolling features to
  dynamic_sensor_cols:
    - rainfall_mm_hr                   # Instantaneous rainfall intensity
    - soil_moisture_pct                # Soil moisture %
    - water_level_m                    # River/stream water level
    - upstream_rainfall_mm_hr          # Upstream station rainfall (if available)

  # Forecast columns (from IMD/NWP API — forward-looking, no shifting needed)
  forecast_cols:
    - forecast_rainfall_3h_mm
    - forecast_rainfall_6h_mm
    - forecast_rainfall_24h_mm

  # Columns to drop before training (metadata, IDs, etc.)
  drop_cols:
    - station_id
    - notes

# ─── Alert Thresholds (for classification output from regressor) ───────────────
alert:
  # If predicted water_level_m exceeds these thresholds, raise alert
  # These are PLACEHOLDER values — replace with site-specific CWC/IMD thresholds
  warning_level_m: 3.5
  danger_level_m: 5.0
  extreme_danger_level_m: 7.0

# ─── Model Configuration ───────────────────────────────────────────────────────
model:
  kind: "xgboost"                       # Options: "xgboost", "gradient_boosting"

  xgboost:
    # Starting point — will be refined by hyperparameter search
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    gamma: 0.0
    reg_alpha: 0.1
    reg_lambda: 1.0
    objective: "reg:squarederror"
    eval_metric: "rmse"
    early_stopping_rounds: 50
    random_state: 42
    n_jobs: -1

  gradient_boosting:
    # scikit-learn GradientBoostingRegressor — secondary option
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    min_samples_split: 10
    min_samples_leaf: 5
    random_state: 42

# ─── Hyperparameter Search (Bayesian — Hyperopt TPE) ──────────────────────────
# Adapted from LandslideSusceptibilityModels::XGboost.py
hyperopt:
  enabled: false                        # Set true to run HPO before final training
  max_evals: 100
  timeout_seconds: 3600

# ─── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  # Metrics — adapted from ECMWFCode4Earth/ml_flood::verification.py (MIT)
  regression_metrics:
    - "RMSE"
    - "MAE"
    - "NSE"                             # Nash-Sutcliffe Efficiency
    - "ME"                              # Mean Error (bias)
    - "R2"

  # If water_level > threshold → flood event → compute classification metrics
  classification_metrics:
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"

  # Forecast horizons to evaluate (if multi-step prediction is used)
  forecast_horizons_hours: [1, 3, 6]

# ─── Artifacts ─────────────────────────────────────────────────────────────────
artifacts:
  model_dir: "artifacts/models/"
  metrics_dir: "artifacts/metrics/"
  # Model filename pattern: {experiment.name}_{model.kind}_{timestamp}.joblib
