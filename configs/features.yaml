# Feature column definitions for ResQShield
# ------------------------------------------
# This file documents the expected sensor input columns and their units.
# The data loader validates incoming CSVs against this schema.

schema:
  # ─── Timestamp ───────────────────────────────────────────────────────────────
  timestamp:
    type: datetime
    format: "%Y-%m-%d %H:%M:%S"       # ISO 8601, hourly resolution assumed
    required: true

  # ─── Station Metadata ─────────────────────────────────────────────────────────
  station_id:
    type: string
    required: false
    description: "Unique sensor station identifier (e.g., 'CWC_GODAVARI_01')"

  # ─── Dynamic Sensor Inputs (ResQShield primary sources) ──────────────────────

  rainfall_mm_hr:
    type: float
    unit: "mm/hr"
    required: true
    valid_range: [0.0, 300.0]          # 300 mm/hr = extreme cloudburst
    description: "Instantaneous rainfall intensity from tipping-bucket gauge"
    source: "AWS / IMD rain gauge"

  cumulative_rainfall_1h_mm:
    type: float
    unit: "mm"
    required: false
    description: "Cumulative rainfall over past 1 hour (auto-computed if absent)"

  cumulative_rainfall_3h_mm:
    type: float
    unit: "mm"
    required: false
    description: "Cumulative rainfall over past 3 hours"

  cumulative_rainfall_6h_mm:
    type: float
    unit: "mm"
    required: false
    description: "Cumulative rainfall over past 6 hours"

  cumulative_rainfall_24h_mm:
    type: float
    unit: "mm"
    required: false
    description: "Cumulative rainfall over past 24 hours (API equivalent: IMD daily)"

  soil_moisture_pct:
    type: float
    unit: "%"
    required: false
    valid_range: [0.0, 100.0]
    description: "Volumetric soil moisture at ~10 cm depth"
    source: "In-situ sensor or SMAP satellite proxy"

  water_level_m:
    type: float
    unit: "m"
    required: true
    valid_range: [0.0, 30.0]           # Site-specific; adjust per catchment
    description: "River/stream water level above datum (CWC gauge reading)"
    source: "CWC telemetry gauge"
    is_target: true                    # This is the prediction target

  discharge_cumec:
    type: float
    unit: "m3/s"
    required: false
    description: "River discharge (if available via rating curve or ADCP)"
    source: "CWC / computed from water_level via site rating curve"

  upstream_rainfall_mm_hr:
    type: float
    unit: "mm/hr"
    required: false
    description: "Rainfall at upstream station (lagged propagation signal)"
    source: "Upstream AWS gauge"

  # ─── NWP / Forecast Inputs ────────────────────────────────────────────────────

  forecast_rainfall_3h_mm:
    type: float
    unit: "mm"
    required: false
    description: "Forecast cumulative rainfall over next 3 hours"
    source: "IMD NWP API / NCMRWF WRF"

  forecast_rainfall_6h_mm:
    type: float
    unit: "mm"
    required: false
    description: "Forecast cumulative rainfall over next 6 hours"
    source: "IMD NWP API / NCMRWF WRF"

  forecast_rainfall_24h_mm:
    type: float
    unit: "mm"
    required: false
    description: "Forecast cumulative rainfall over next 24 hours"
    source: "IMD NWP API"

# ─── Engineered Features (auto-generated by engineer.py) ─────────────────────
# These do NOT appear in raw CSV — they are created by the pipeline.
# Listed here for documentation purposes only.
engineered:
  - "rainfall_mm_hr_lag_{N}h"           # N in lag_hours from config
  - "water_level_m_lag_{N}h"
  - "soil_moisture_pct_lag_{N}h"
  - "rainfall_rolling_sum_{N}h"         # N in rolling_sum_windows from config
  - "water_level_delta_{N}h"            # Rate of rise
  - "antecedent_precipitation_index"    # Exponentially weighted rainfall history
