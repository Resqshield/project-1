# ResQShield — Gradient Boosting Flood Regressor Config (T09)
# ─────────────────────────────────────────────────────────────
# GradientBoostingRegressor configuration for the T09 flash-flood
# comparison baseline.  This config reuses the existing FloodModel
# wrapper pattern from configs/resqshield_default.yaml.

experiment:
  name: "flood_gb_v1"
  description: >-
    GradientBoostingRegressor flash-flood water-level regressor (T09).
    1-hour ahead forecast horizon. Trained on CWC telemetry once data
    is obtained via formal request. Metrics pending real data.
  seed: 42
  version: "1.0.0"
  forecast_horizon_hours: 1
  data_source: "CWC/NWDP (pending formal data request)"
  station: null    # Set to CWC station code once data is obtained
  basin: null      # Set to CWC basin name once data is obtained

# ─── Data Paths ───────────────────────────────────────────────────────────────
data:
  raw_sensor_csv: "data/raw/cwc_flood_data.csv"
  processed_features_csv: "data/processed/flood_features.csv"
  timestamp_col: "timestamp"
  target_col: "water_level_m"

# ─── Chronological Split ──────────────────────────────────────────────────────
# NEVER shuffle time-series data. Adapt dates once real CWC data is obtained.
# Example split for 5+ years of data:
#   early 60% → train
#   next 20%  → validation
#   last 20%  → test
split:
  train_end: null    # Set after inspecting actual CWC data date range
  val_end: null      # Set after inspecting actual CWC data date range

# ─── Feature Engineering ─────────────────────────────────────────────────────
features:
  lag_hours: [1, 3, 6, 12, 24]
  rolling_sum_windows: [1, 3, 6, 12, 24]   # Cumulative rainfall windows (T09)
  delta_features:
    - col: "water_level_m"
      windows: [1, 3, 6]
  dynamic_sensor_cols:
    - rainfall_mm_hr
    - water_level_m
  drop_cols: []

# ─── Alert Thresholds ─────────────────────────────────────────────────────────
# Set to null until CWC Warning/Danger Level confirmed for the station.
# Classification metrics will remain disabled while these are null.
alert:
  warning_level_m: null     # From CWC AFF (WL) — set per station
  danger_level_m: null      # From CWC AFF (DL) — set per station
  hfl_m: null               # From CWC AFF (HFL) — set per station

# ─── Model ───────────────────────────────────────────────────────────────────
model:
  kind: "gradient_boosting"
  gradient_boosting:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    min_samples_split: 10
    min_samples_leaf: 5
    random_state: 42

# ─── Evaluation ───────────────────────────────────────────────────────────────
evaluation:
  regression_metrics:
    - "RMSE"
    - "MAE"
    - "NSE"
    - "ME"
    - "R2"
  # Classification metrics disabled until alert thresholds are calibrated
  classification_metrics: []
  forecast_horizons_hours: [1]

# ─── Artifacts ────────────────────────────────────────────────────────────────
artifacts:
  model_dir: "artifacts/models/"
  metrics_dir: "artifacts/metrics/"
